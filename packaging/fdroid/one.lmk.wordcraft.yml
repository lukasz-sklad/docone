AuthorName: WordCraft contributors, lukasz-sklad
SourceCode: https://github.com/lukasz-sklad/docone
IssueTracker: https://github.com/lukasz-sklad/docone/issues
Changelog: https://github.com/lukasz-sklad/docone/releases

Name: DocOne

RepoType: git
Repo: https://github.com/lukasz-sklad/docone.git

Builds:
  - versionName: 0.18.1.4
    versionCode: 4
    commit: 1f8c2b93ed3deb6cb32b58dbae0f1ecbe04aca46
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y build-essential pkg-config rustup
    gradle:
      - foss
    srclibs:
      - craft-i18n@e56d26244bbac099bfd42e23fb12f78a4be418a7
    rm:
      - android/gradle/wrapper/gradle-wrapper.jar
    prebuild:
      - sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - sed -i -e '/foojay/d' settings.gradle.kts
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup default 1.99.0
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install cargo-ndk@4.1.2 --locked
      - export ANDROID_NDK_HOME=$$NDK$$
      - export CRAFT_I18N_DIR=$$craft-i18n$$
      - export CRAFT_I18N_REQUIRED=1
      - export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
      - pushd .. && cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs
        build --release --locked -p wordcraft-android && popd
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+(\.[0-9]+)*$
CurrentVersion: 0.18.1.4
CurrentVersionCode: 4
